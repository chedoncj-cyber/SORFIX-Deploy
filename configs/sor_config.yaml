routing:
  liquidity_weight:   0.28
  spread_weight:      0.18
  fee_weight:         0.16
  fx_weight:          0.18
  latency_weight:     0.10
  reliability_weight: 0.10
  max_order_splits: 5
  min_split_quantity: 100.0

circuit_breaker:
  failure_threshold: 5
  success_threshold: 3
  timeout_seconds: 30

cache:
  shard_count: 256

execution:
  max_retries: 3
  retry_delay_ms: 100
  order_timeout_seconds: 30
  simulate: true

fx_rates:
  base_currency: USD
  USD: 1.0
  GBP: 0.79
  HKD: 7.82
  JPY: 158.5
  CNY: 7.25
  SAR: 3.75
  INR: 84.2
  EUR: 0.92

api:
  host: 0.0.0.0
  port: 9091
  workers: 1

market_data:
  update_interval_seconds: 0.1
  kafka_brokers: "kafka:9092"
  use_kafka: false

risk:
  enabled: true
  max_order_qty: 1000000.0
  max_order_notional: 50000000.0
  price_band_pct: 0.05
  max_daily_notional: 500000000.0
  max_position_qty: 10000000.0

auth:
  enabled: false
  api_keys:
    - "dev-key-change-in-production"

rate_limit:
  enabled: true
  requests_per_minute: 300
