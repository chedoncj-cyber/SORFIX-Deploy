services:
  - type: web
    name: pan-sorfix
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: pan-sorfix
    repo: https://github.com/chedoncj-cyber/SORFIX-Deploy
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
